name: Release

# Build and publish installable artifacts when a version tag is pushed, or on
# demand. Normal CI (ci.yml) runs on every push and PR; this only runs for
# releases so the heavy desktop and mobile builds do not fire on every commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  backend-image:
    name: Backend image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/atlas-backend:latest

  desktop:
    name: Desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev build-essential curl wget file libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build the app and attach to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "ATLAS ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: "See CHANGELOG.md."

  android:
    name: Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build release APK
        working-directory: companion-app/companion_app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: companion-app/companion_app/build/app/outputs/flutter-apk/app-release.apk
          draft: true
          body: "See CHANGELOG.md."
