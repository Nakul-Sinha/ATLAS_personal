name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "ruff==0.8.4"
      - name: Lint
        run: ruff check backend
      - name: Test
        working-directory: backend
        env:
          ATLAS_AGENT_MODE: mock
          ATLAS_MOCK_STEP_DELAY: "0"
        run: pytest -q

  ml:
    name: ML pipeline (lint and hermetic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install light test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements-test.txt "ruff==0.8.4"
      - name: Lint
        run: ruff check ml/config ml/perception ml/agent ml/memory ml/tests
      - name: Hermetic tests
        run: pytest -q ml/tests

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (static export)
        run: npm run build

  tauri:
    name: Tauri desktop (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebView and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential curl wget file libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Build frontend (produces ../out for the Tauri context)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Cargo check
        working-directory: frontend/src-tauri
        run: cargo check

  companion:
    name: Companion app (Flutter analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app/companion_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
